<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockapp</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e6e4df;
    --accent: #3d5afe; --good: #1f9d55; --warn: #d97706; --bad: #dc2626; --chip: #f0efeb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1d1d20; --ink: #f2f2f4; --muted: #9a9aa2; --line: #2c2c31;
            --accent: #7b8cff; --good: #3ecf7a; --warn: #f5a524; --bad: #f87171; --chip: #26262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .wide { grid-column: 1 / -1; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
            background: var(--chip); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.on .dot { background: var(--good); }
  .score-wrap { display: flex; align-items: center; gap: 24px; }
  .score-wrap > div:last-child { flex: 1; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 700; }
  .label { font-size: 18px; font-weight: 600; }
  .rows { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .rows div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; }
  .rows b { color: var(--ink); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar .fill { width: 100%; max-width: 44px; border-radius: 6px 6px 3px 3px; background: var(--accent); min-height: 3px; }
  .bar .v { font-size: 12px; color: var(--muted); }
  .bar .d { font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; }
  .chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .chip button:hover { color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input[type=text] { flex: 1 1 140px; }
  .btn { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  .btn.ghost { background: var(--chip); color: var(--ink); }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list li:last-child { border-bottom: 0; }
  .list button { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .list button:hover { color: var(--bad); }
  .error { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
  #focus-now { display: inline-flex; gap: 8px; }
  #focus-now[hidden] { display: none; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Blockapp</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="status" id="status"><span class="dot"></span><span id="status-text">Loading…</span></span>
      <span id="focus-now">
        <select id="focus-minutes" aria-label="Focus length">
          <option value="25">25 min</option>
          <option value="50">50 min</option>
          <option value="90">90 min</option>
        </select>
        <button class="btn" id="focus-start">Start focus now</button>
      </span>
      <button class="btn ghost" id="skip" hidden>End session early</button>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Focus Score today</h2>
      <div class="score-wrap">
        <div class="ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>
            <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--good)" stroke-width="12"
                    stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          </svg>
          <div class="num" id="score">–</div>
        </div>
        <div>
          <div class="label" id="label"></div>
          <div class="rows" id="breakdown"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Last 7 days</h2>
      <div class="bars" id="history"></div>
    </section>

    <section class="card">
      <h2>Blocked apps</h2>
      <div class="chips" id="blocked"></div>
      <form id="add-app">
        <input type="text" id="app-name" list="running" placeholder="App name, e.g. discord" autocomplete="off">
        <datalist id="running"></datalist>
        <button class="btn">Block</button>
      </form>
      <div class="error" id="app-error"></div>
    </section>

    <section class="card">
      <h2>Focus sessions</h2>
      <ul class="list" id="schedules"></ul>
      <form id="add-schedule">
        <select id="days">
          <option value="weekdays">Weekdays</option>
          <option value="everyday">Every day</option>
          <option value="weekends">Weekends</option>
        </select>
        <input type="time" id="start" value="09:00" required>
        <input type="time" id="end" value="12:00" required>
        <button class="btn">Add</button>
      </form>
      <div class="error" id="schedule-error"></div>
    </section>

    <section class="card wide">
      <h2>Biggest distractions today</h2>
      <ul class="list" id="distractions"></ul>
      <p class="hint">Distracted time is counted while this dashboard (or <code>blockapp run</code>) is open.</p>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function colorFor(score) {
  return score >= 70 ? "var(--good)" : score >= 50 ? "var(--warn)" : "var(--bad)";
}

function render(s) {
  $("status").classList.toggle("on", s.session.active);
  $("status-text").textContent = s.session.active ? `Focus session on until ${s.session.until}` : "No focus session right now";
  $("skip").hidden = !s.session.active;
  $("focus-now").hidden = s.session.active;

  $("score").textContent = s.score;
  $("label").textContent = s.label;
  const arc = $("arc");
  arc.style.stroke = colorFor(s.score);
  arc.style.strokeDashoffset = 326.7 * (1 - s.score / 100);
  const b = s.breakdown, p = b.penalties;
  $("breakdown").innerHTML = `
    <div><span>Blocked app opens</span><b>${b.attempts} (−${p.attempts})</b></div>
    <div><span>Sessions ended early</span><b>${b.skips} (−${p.skips})</b></div>
    <div><span>Distracted minutes</span><b>${b.minutes} (−${p.time})</b></div>`;

  $("history").innerHTML = s.history.map((d) => `
    <div class="bar" title="${d.date}: ${d.score}">
      <span class="v">${d.score}</span>
      <div class="fill" style="height:${Math.max(2, d.score)}%;background:${colorFor(d.score)}"></div>
      <span class="d">${d.day}</span>
    </div>`).join("");

  $("blocked").innerHTML = s.blocked.length
    ? s.blocked.map((a) => `<span class="chip">${esc(a)}<button data-remove-app="${esc(a)}" aria-label="Unblock ${esc(a)}">×</button></span>`).join("")
    : `<span class="empty">No apps blocked yet.</span>`;
  $("running").innerHTML = s.running.map((a) => `<option value="${esc(a)}">`).join("");

  $("schedules").innerHTML = s.schedules.length
    ? s.schedules.map((d, i) => `<li><span>${esc(d)}</span><button data-remove-schedule="${i + 1}">Remove</button></li>`).join("")
    : `<li class="empty">No sessions scheduled yet.</li>`;

  $("distractions").innerHTML = s.distractions.length
    ? s.distractions.map((d) => `<li><span>${esc(d.app)}</span><span>${d.minutes} min · ${d.opens} blocked ${d.opens === 1 ? "open" : "opens"}</span></li>`).join("")
    : `<li class="empty">Nothing yet today. Nice.</li>`;
}

async function call(path, body, errorEl) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await res.json();
  if (errorEl) $(errorEl).textContent = data.error || "";
  if (!data.error) render(data);
  return !data.error;
}

async function refresh() {
  try { render(await (await fetch("/api/state")).json()); } catch (e) {}
}

$("add-app").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (await call("/api/apps/add", { name: $("app-name").value }, "app-error")) $("app-name").value = "";
});
$("add-schedule").addEventListener("submit", (e) => {
  e.preventDefault();
  call("/api/schedules/add", { days: $("days").value, start: $("start").value, end: $("end").value }, "schedule-error");
});
$("skip").addEventListener("click", () => call("/api/skip"));
$("focus-start").addEventListener("click", () => call("/api/focus", { minutes: $("focus-minutes").value }));
document.addEventListener("click", (e) => {
  const app = e.target.dataset.removeApp, sched = e.target.dataset.removeSchedule;
  if (app) call("/api/apps/remove", { name: app });
  if (sched) call("/api/schedules/remove", { number: sched });
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>

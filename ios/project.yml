# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Blockapp
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # Change this to something unique to you, e.g. com.yourname.blockapp
    BUNDLE_PREFIX: com.gaurijain21.blockapp
    APP_GROUP: group.$(BUNDLE_PREFIX)
    # Your Apple Developer Team ID (Xcode > Settings > Accounts)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Blockapp:
    type: application
    platform: iOS
    sources: [Blockapp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Blockapp/Info.plist
      properties:
        CFBundleDisplayName: Blockapp
        AppGroup: $(APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Blockapp/Blockapp.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: BlockappMonitor
      - target: BlockappShieldConfig
      - target: BlockappShieldAction

  BlockappMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).monitor
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Blockapp Monitor
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

  BlockappShieldConfig:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shieldconfig
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Blockapp Shield
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

  BlockappShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shieldaction
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Blockapp Shield Action
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

schemes:
  Blockapp:
    build:
      targets:
        Blockapp: all
